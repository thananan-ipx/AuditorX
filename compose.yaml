services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auditorx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AUDITORX_DB_PASSWORD:-auditorx-local-admin}
      AUDITORX_DB_APP_PASSWORD: ${AUDITORX_DB_APP_PASSWORD:-auditorx-local-api}
    ports:
      - "127.0.0.1:${AUDITORX_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init.sh:/docker-entrypoint-initdb.d/00-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auditorx"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    entrypoint: ["/auditorx-migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://postgres:${AUDITORX_DB_PASSWORD:-auditorx-local-admin}@postgres:5432/auditorx?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgres://auditorx_api:${AUDITORX_DB_APP_PASSWORD:-auditorx-local-api}@postgres:5432/auditorx?sslmode=disable
      REPOSITORY_STORAGE: postgres
      SCAN_QUEUE_ENABLED: ${SCAN_QUEUE_ENABLED:-true}
      LOCAL_SCAN_ENABLED: "true"
      LOCAL_SCAN_HOST_ROOT: ${AUDITORX_LOCAL_SOURCE_ROOT:-C:/Users/thana/Documents/GitHub/IProgressX}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${AUDITORX_WEB_PORT:-3000}}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
    ports:
      - "${AUDITORX_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      scan-worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  worker-setup:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/setup-scan-worker.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: auditorx
      PGUSER: postgres
      PGPASSWORD: ${AUDITORX_DB_PASSWORD:-auditorx-local-admin}
      AUDITORX_DB_WORKER_PASSWORD: ${AUDITORX_DB_WORKER_PASSWORD:-auditorx-local-worker}
    volumes:
      - ./backend/docker/setup-scan-worker.sh:/setup-scan-worker.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  scan-worker:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.worker
    environment:
      SCAN_WORKER_DATABASE_URL: postgres://auditorx_worker:${AUDITORX_DB_WORKER_PASSWORD:-auditorx-local-worker}@postgres:5432/auditorx?sslmode=disable
      LOCAL_SCAN_ROOT: /scan-sources
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
    read_only: true
    volumes:
      - type: bind
        source: ${AUDITORX_LOCAL_SOURCE_ROOT:-C:/Users/thana/Documents/GitHub/IProgressX}
        target: /scan-sources
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    depends_on:
      worker-setup:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${AUDITORX_API_PORT:-8080}
    environment:
      API_URL: http://api:8080
    ports:
      - "${AUDITORX_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
