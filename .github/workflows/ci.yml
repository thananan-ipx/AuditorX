name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prediction:
    name: Python prediction API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r prediction/requirements-test.txt
      - run: python -m unittest discover -s prediction -v

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format, vet, tests with race detection, and build
        shell: pwsh
        run: ./scripts/verify.ps1 -Target backend -Race

  database:
    name: Migration, RLS and Go persistence tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/database-tests/package-lock.json
      - name: Install isolated database test dependencies
        working-directory: tools/database-tests
        run: npm ci
      - name: Install pinned Semgrep in an isolated environment
        run: |
          python3 -m venv tools/scanner-env
          tools/scanner-env/bin/python -m pip install -r tools/scanner-requirements.txt
      - name: Verify migration, RLS and actual Go adapter
        shell: pwsh
        env:
          AUDITORX_TEST_SEMGREP: ${{ github.workspace }}/tools/scanner-env/bin/semgrep
        run: ./scripts/verify.ps1 -Target database
      - name: Verify scanner rules including Next.js safe and unsafe fixtures
        working-directory: backend
        env:
          AUDITORX_TEST_SEMGREP: ${{ github.workspace }}/tools/scanner-env/bin/semgrep
        run: go test -count=1 -timeout=2m -run '^TestSemgrep(Fixture|RuleCatalog|NextJS)$' -v ./internal/modules/scan

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://localhost:8080
      API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, types, unit tests, and production build
        shell: pwsh
        run: ./scripts/verify.ps1 -Target frontend
