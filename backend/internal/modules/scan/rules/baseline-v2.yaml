rules:
  - id: auditorx.python.security.dynamic-eval
    languages: [python]
    severity: ERROR
    message: Avoid evaluating dynamic code; use a constrained parser instead.
    pattern: eval(...)

  - id: auditorx.javascript.security.dynamic-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: Avoid evaluating dynamic code; use a constrained parser instead.
    pattern: eval(...)

  - id: auditorx.go.security.tls-verification-disabled
    languages: [go]
    severity: ERROR
    message: TLS certificate verification is disabled. Keep InsecureSkipVerify false.
    pattern: 'tls.Config{..., InsecureSkipVerify: true, ...}'

  - id: auditorx.python.security.hardcoded-secret
    languages: [python]
    severity: ERROR
    message: Do not store credentials or secrets in source code; load them from an approved secret store.
    patterns:
      - pattern: $KEY = $VALUE
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^(api_?key|client_?secret|password|passwd|secret|access_?token|auth_?token|private_?key)$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^["'][^"']{8,}["']$

  - id: auditorx.javascript.security.hardcoded-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: Do not store credentials or secrets in source code; load them from an approved secret store.
    patterns:
      - pattern-either:
          - pattern: const $KEY = $VALUE
          - pattern: let $KEY = $VALUE
          - pattern: var $KEY = $VALUE
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^(api_?key|apiKey|client_?secret|clientSecret|password|passwd|secret|access_?token|accessToken|auth_?token|authToken|private_?key|privateKey)$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^["'`][^"'`]{8,}["'`]$

  - id: auditorx.go.security.hardcoded-secret
    languages: [go]
    severity: ERROR
    message: Do not store credentials or secrets in source code; load them from an approved secret store.
    patterns:
      - pattern-either:
          - pattern: $KEY := $VALUE
          - pattern: var $KEY = $VALUE
          - pattern: $KEY = $VALUE
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^(api_?key|apiKey|client_?secret|clientSecret|password|passwd|secret|access_?token|accessToken|auth_?token|authToken|private_?key|privateKey)$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^["`][^"`]{8,}["`]$

  - id: auditorx.python.security.shell-command-execution
    languages: [python]
    severity: ERROR
    message: Avoid shell command execution; use an argument array without a shell and validate every argument.
    pattern-either:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
      - pattern: os.system(...)
      - pattern: os.popen(...)

  - id: auditorx.javascript.security.shell-command-execution
    languages: [javascript, typescript]
    severity: ERROR
    message: Avoid shell command execution; use an argument array with execFile or spawn and validate every argument.
    pattern-either:
      - pattern: child_process.exec(...)
      - pattern: child_process.execSync(...)
      - pattern: require("child_process").exec(...)
      - pattern: require("child_process").execSync(...)
      - pattern: require("node:child_process").exec(...)
      - pattern: require("node:child_process").execSync(...)

  - id: auditorx.python.security.sql-string-construction
    languages: [python]
    severity: ERROR
    message: Do not construct SQL with interpolation or concatenation; use parameterized queries.
    pattern-either:
      - pattern: $DB.execute(f"...")
      - pattern: $DB.execute(f'...')
      - pattern: $DB.execute("..." % ...)
      - pattern: $DB.execute('...' % ...)
      - pattern: $DB.execute("..." + ...)
      - pattern: $DB.execute('...' + ...)

  - id: auditorx.javascript.security.sql-template-interpolation
    languages: [javascript, typescript]
    severity: ERROR
    message: Do not construct SQL with template interpolation; use a parameterized query API.
    pattern-either:
      - pattern: '$DB.query(`...${$VALUE}...`)'
      - pattern: '$DB.execute(`...${$VALUE}...`)'

  - id: auditorx.python.coding-standard.sensitive-logging
    languages: [python]
    severity: WARNING
    message: Do not write credentials or secrets to logs.
    patterns:
      - pattern-either:
          - pattern: logging.$METHOD(..., $SECRET, ...)
          - pattern: $LOGGER.$METHOD(..., $SECRET, ...)
          - pattern: print(..., $SECRET, ...)
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i)^(api_?key|client_?secret|password|passwd|secret|access_?token|auth_?token|private_?key)$

  - id: auditorx.javascript.coding-standard.sensitive-logging
    languages: [javascript, typescript]
    severity: WARNING
    message: Do not write credentials or secrets to logs.
    patterns:
      - pattern-either:
          - pattern: console.$METHOD(..., $SECRET, ...)
          - pattern: $LOGGER.$METHOD(..., $SECRET, ...)
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i)^(api_?key|apiKey|client_?secret|clientSecret|password|passwd|secret|access_?token|accessToken|auth_?token|authToken|private_?key|privateKey)$

  - id: auditorx.go.coding-standard.sensitive-logging
    languages: [go]
    severity: WARNING
    message: Do not write credentials or secrets to logs.
    patterns:
      - pattern-either:
          - pattern: log.$METHOD(..., $SECRET, ...)
          - pattern: $LOGGER.$METHOD(..., $SECRET, ...)
          - pattern: fmt.Printf(..., $SECRET, ...)
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i)^(api_?key|apiKey|client_?secret|clientSecret|password|passwd|secret|access_?token|accessToken|auth_?token|authToken|private_?key|privateKey)$

  - id: auditorx.go.code-quality.unhandled-json-error
    languages: [go]
    severity: WARNING
    message: Handle the error returned by JSON encoding or decoding.
    patterns:
      - pattern-either:
          - pattern: json.NewEncoder(...).Encode(...)
          - pattern: json.NewDecoder(...).Decode(...)
      - pattern-not-inside: $ERR := json.NewEncoder(...).Encode(...)
      - pattern-not-inside: $ERR = json.NewEncoder(...).Encode(...)
      - pattern-not-inside: $ERR := json.NewDecoder(...).Decode(...)
      - pattern-not-inside: $ERR = json.NewDecoder(...).Decode(...)
      - pattern-not-inside: return json.NewEncoder(...).Encode(...)
      - pattern-not-inside: return json.NewDecoder(...).Decode(...)
      - pattern-not-inside: |
          if $ERR := json.NewEncoder(...).Encode(...); $ERR != nil {
            ...
          }
      - pattern-not-inside: |
          if $ERR := json.NewDecoder(...).Decode(...); $ERR != nil {
            ...
          }
